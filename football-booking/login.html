<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập — DatSan⚽</title>

    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div id="site-navbar"></div>

    <main class="section">
      <div class="container">
        <div class="card card--padded form-card">
          <h2 class="form-title">Đăng nhập</h2>
          <p class="form-subtitle"></p>

          <form class="form" id="loginForm">
            <div>
              <label class="label" for="email">Email</label>
              <input
                class="input"
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div>
              <label class="label" for="password">Mật khẩu</label>
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                minlength="6"
                required
              />
              <div class="help"></div>
            </div>

            <div class="form-row">
              <label
                class="help"
                style="display: flex; gap: 8px; align-items: center; margin: 0"
              >
                <input type="checkbox" />
                Ghi nhớ đăng nhập
              </label>

              <a class="help" href="#" style="justify-self: end"
                >Quên mật khẩu?</a
              >
            </div>

            <button class="btn btn--primary btn--full" type="submit">
              Đăng nhập
            </button>
            <div class="help" style="text-align: center">
              Chưa có tài khoản?
              <a href="/register.html" style="text-decoration: underline"
                >Đăng ký</a
              >
            </div>
          </form>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="/js/app.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("loginForm");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          alert(
            "Demo: đăng nhập thành công (UI). Bạn có thể làm Auth thật bằng Firebase/Supabase sau.",
          );
          window.location.href = "/venues.html";
        });
      });
    </script>
  </body>
</html>
